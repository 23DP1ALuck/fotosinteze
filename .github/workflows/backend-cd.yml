name: backend_cd

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, macOS, fotosinteze-production]
    timeout-minutes: 20
    concurrency:
      group: fotosinteze-backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Skip superseded merges
        id: current
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$MERGE_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and deploy backend container
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export BACKEND_ENV_FILE="$HOME/fotosinteze-backend/.env"
          export BACKEND_DATA_DIR="$HOME/fotosinteze-backend"
          test -f "$BACKEND_ENV_FILE"
          docker info > /dev/null
          docker compose config --quiet
          trap 'docker compose logs --tail=100 backend' ERR
          docker compose build backend
          docker compose stop backend
          docker compose run --rm --no-deps -T backend python - <<'PYTHON'
          import sqlite3
          from datetime import datetime, timezone
          from pathlib import Path

          database = Path('/data/database.sqlite')
          if database.is_file():
              backups = Path('/data/backups')
              backups.mkdir(exist_ok=True)
              backup = backups / (datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%S%fZ') + '.sqlite')
              with sqlite3.connect(database) as source, sqlite3.connect(backup) as target:
                  source.backup(target)
          PYTHON
          docker compose run --rm --no-deps backend alembic upgrade head
          docker compose up -d --no-deps --wait --wait-timeout 120 backend
